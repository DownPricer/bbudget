<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff9f8"><title>Enveloppes — Bbudget</title><style>
:root{--bg:#fff9f8;--ink:#30283d;--muted:#988a9b;--line:#f1e7eb;--pink:#dd7099;--pale:#ffedf4;--lav:#d9c1ec;--mint:#a9d9cb}
*{box-sizing:border-box}body{margin:0;background:#e9e1e8;color:var(--ink);font:14px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--bg);padding:22px 18px 105px}h1{font-size:25px;letter-spacing:-.8px;margin:0}.eyebrow,.sub{font-size:12px;color:var(--muted);margin:0 0 3px}.sub{margin:4px 0 0}.head{display:flex;align-items:center;gap:11px}.back{border:1px solid var(--line);background:white;color:var(--pink);width:36px;height:36px;border-radius:12px;font-size:22px}.hero{background:#30283d;color:white;border-radius:23px;padding:20px;margin:22px 0 16px;box-shadow:0 12px 28px #30283d25}.hero small{color:#e3d7e4}.hero strong{display:block;font-size:34px;letter-spacing:-1.3px;margin:4px 0}.hero p{color:#e3d7e4;margin:0;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border-radius:19px;padding:15px;background:#f7eaf3}.stat.mint{background:#eaf7f1}.stat.lav{background:#f5ecfa}.stat small{display:block;color:#8d8291;font-size:11px}.stat b{font-size:21px;letter-spacing:-.5px}.section{margin-top:25px}.section h2{font-size:16px;margin:0 0 11px}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:15px;margin:9px 0;box-shadow:0 5px 16px #693c6009}.row{display:flex;align-items:center;gap:11px}.icon{width:39px;height:39px;flex:none;border-radius:13px;background:var(--pale);display:grid;place-items:center;font-size:18px}.grow{flex:1;min-width:0}.grow b{display:block;font-size:13px}.grow small{display:block;font-size:11px;color:var(--muted);margin-top:2px}.value{font-weight:800;white-space:nowrap}.track{height:6px;background:#f5eff3;border-radius:10px;margin-top:12px;overflow:hidden}.track i{height:100%;display:block;border-radius:10px;background:var(--pink)}.button{border:0;background:var(--pink);color:white;border-radius:13px;padding:12px 16px;font-weight:750}.button.full{width:100%;margin-top:12px}.ghost{border:1px dashed #ddcedb;background:#fff;border-radius:14px;padding:13px;width:100%;color:#8d637e;font-weight:700;margin-top:8px}.pill{border:1px solid var(--line);background:white;border-radius:99px;padding:8px 11px;color:#756b7b;white-space:nowrap}.pill.active{border-color:#e9abc3;background:var(--pale);color:#bd5b83}.chips{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin:12px -18px;padding:0 18px}.chips::-webkit-scrollbar{display:none}.muted{color:var(--muted);font-size:11px}.tip{background:#f8eaf3;border-radius:17px;padding:14px;color:#8e687e;font-size:12px;margin-top:17px}.split{display:flex;justify-content:space-between;align-items:center}.listbutton{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid #f6eff3;background:white;padding:14px 4px;text-align:left;color:var(--ink)}.listbutton:last-child{border-bottom:0}.listbutton span:nth-child(2){flex:1}.donut{width:164px;height:164px;border-radius:50%;background:conic-gradient(#f4a9c8 0 49.58%,#d9c1ec 49.58% 70.24%,#a9d9cb 70.24%);display:grid;place-items:center;margin:18px auto}.donut:before{content:'';position:absolute;background:white;border-radius:50%;width:110px;height:110px}.donut b{position:relative;text-align:center;font-size:18px}.donut small{display:block;color:var(--muted);font-size:10px;font-weight:500}.overlay{position:fixed;inset:0;background:#30283d80;display:none;align-items:flex-end;justify-content:center;z-index:5}.overlay.open{display:flex}.sheet{background:var(--bg);width:min(100%,430px);border-radius:25px 25px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 15px;font-size:20px}.close{float:right;border:0;background:white;border-radius:50%;width:30px;height:30px;color:var(--muted);font-size:20px}.field{display:block;width:100%;border:1px solid var(--line);border-radius:12px;background:white;height:44px;padding:0 12px;margin:6px 0 12px;color:var(--ink)}label{font-size:12px;font-weight:700;color:#746979}.modal-actions{display:flex;gap:7px;flex-wrap:wrap}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);height:77px;background:#fffdfdf0;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 4px;z-index:3}nav a{text-decoration:none;color:#a295a4;font-size:9px;display:grid;place-items:center;gap:3px;min-width:60px}nav a.active{color:var(--pink);font-weight:800}nav i{font-style:normal;font-size:19px}nav a.active i{background:var(--pale);border-radius:9px;padding:0 8px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#30283d;color:white;border-radius:11px;padding:10px 14px;z-index:9;display:none;white-space:nowrap;font-size:12px}@media(min-width:650px){body{padding:22px}.app{border-radius:30px;min-height:830px;box-shadow:0 25px 70px #60445c22}nav{bottom:22px;border-radius:0 0 30px 30px}}
</style></head><body data-page="enveloppes"><main class="app" id="content"></main><nav aria-label="Navigation principale"><a href="accueil.html" data-nav="accueil"><i>⌂</i>Accueil</a><a href="depenses.html" data-nav="depenses"><i>▤</i>Dépenses</a><a href="coup-de-coeur.html" data-nav="coup-de-coeur"><i>♡</i>Coup de cœur</a><a href="dettes-et-epargne.html" data-nav="dettes-et-epargne"><i>♧</i>Dettes & épargne</a><a href="plus.html" data-nav="plus"><i>•••</i>Plus</a></nav><div class="overlay"><div class="sheet"><button class="close" onclick="closeModal()" aria-label="Fermer">×</button><h2 id="sheet-title"></h2><div id="sheet-body"></div></div></div><div class="toast"></div><script>
let expenses=[['Café + ciné','Sorties',18,'🍹'],['Masque cheveux','Cosméto',12.5,'💄'],['Haut H&M','Fringues',29.99,'👗']];
let envelopes=[['Fringues','👗',29.99,80,'#f2a4c1'],['Cosméto','💄',12.5,40,'#d9c1ec'],['Sorties','🍹',18,60,'#a9d9cb'],['Divers','🛍️',0,30,'#f3d59d']];
let subs=[['Spotify',5.99,5],['Forfait téléphone',9.99,12]], wishes=[], debt=120, saved=45, skipped=0;
const euro=n=>Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const $=s=>document.querySelector(s);
function toast(t){const n=$('.toast');n.textContent=t;n.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>n.style.display='none',2200)}
function closeModal(){$('.overlay').classList.remove('open')}
function modal(title,body){$('#sheet-title').textContent=title;$('#sheet-body').innerHTML=body;$('.overlay').classList.add('open')}
function form(title,fields,onSubmit){modal(title,'<form id="modal-form">'+fields.map(f=>'<label>'+f[1]+'<input class="field" name="'+f[0]+'" type="'+(f[2]||'text')+'" '+(f[2]==='number'?'min="0.01" step="0.01"':'')+' required></label>').join('')+'<button class="button full">Enregistrer</button></form>');$('#modal-form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));onSubmit(d);closeModal();render()}}
function go(slug){location.href=slug+'.html'}
function render(){const p=document.body.dataset.page, root=$('#content');if(!root)return;
const card=(icon,name,sub,value,extra='')=>'<div class="card"><div class="row"><div class="icon">'+icon+'</div><div class="grow"><b>'+name+'</b><small>'+sub+'</small></div><span class="value">'+value+'</span></div>'+extra+'</div>';
if(p==='accueil'){root.innerHTML='<p class="eyebrow">Bonjour Léa 👋</p><h1>Octobre 2026</h1><div class="hero"><small>Il te reste ce mois-ci</small><strong>149,51 €</strong><p>Un budget à ton rythme 💗</p></div><div class="grid"><button class="button" onclick="go(\'depenses\')">+ Dépense</button><button class="button" style="background:#79bda9" onclick="toast(\'Rentrée ajoutée dans la maquette\')">+ Rentrée</button></div><div class="section"><h2>À venir</h2>'+card('♫','Spotify','5 novembre','5,99 €')+'</div><div class="section"><div class="split"><h2>Enveloppes plaisir</h2><a href="enveloppes.html">Voir tout →</a></div>'+envelopes.slice(0,2).map(e=>card(e[1],e[0],euro(e[2])+' / '+euro(e[3]),euro(e[3]-e[2]),'<div class="track"><i style="width:'+e[2]/e[3]*100+'%;background:'+e[4]+'"></i></div>')).join('')+'</div>'}
if(p==='depenses'){root.innerHTML='<div class="head"><button class="back" onclick="go(\'accueil\')">‹</button><div><p class="eyebrow">Octobre 2026</p><h1>Dépenses</h1></div></div><div class="hero"><small>Dépensé ce mois-ci</small><strong>'+euro(expenses.reduce((n,e)=>n+e[2],0))+'</strong><p>'+expenses.length+' dépenses enregistrées</p></div><div class="chips" id="filters">'+['Toutes','Fringues','Cosméto','Sorties','Divers'].map(x=>'<button class="pill" data-filter="'+x+'">'+x+'</button>').join('')+'</div><div id="expense-list"></div><button class="button full" id="add-expense">+ Ajouter une dépense</button>';const draw=(filter='Toutes')=>{$('#expense-list').innerHTML=expenses.filter(e=>filter==='Toutes'||e[1]===filter).map(e=>card(e[3],e[0],e[1],euro(e[2]))).join('')||'<div class="card muted">Aucune dépense ici.</div>';document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))};draw();$('#filters').onclick=e=>{if(e.target.dataset.filter)draw(e.target.dataset.filter)};$('#add-expense').onclick=()=>form('Nouvelle dépense',[['name','Nom'],['amount','Montant','number']],d=>expenses.unshift([d.name,'Divers',+d.amount,'🛍️']))}
if(p==='coup-de-coeur'){root.innerHTML='<p class="eyebrow">La règle des 48 h, en douceur</p><h1>Coup de cœur 💘</h1><div class="hero"><small>Une petite pause avant de craquer</small><strong>48 h</strong><p>Ajoute une envie, puis décide après deux jours.</p></div><div class="stat mint"><small>Économisé grâce aux envies abandonnées</small><b>'+euro(skipped)+'</b></div><div class="section"><h2>Mes envies en attente</h2><div id="wishes">'+(wishes.length?wishes.map((w,i)=>card('♡',w[0],'En attente · '+w[2],euro(w[1]),'<button class="ghost" onclick="skipped+='+w[1]+';wishes.splice('+i+',1);render()">Je passe mon tour</button>')).join(''):'<div class="card muted">Aucun coup de cœur en attente ✨</div>')+'</div><button class="button full" id="add-wish">+ Ajouter un coup de cœur</button></div>';$('#add-wish').onclick=()=>form('Nouveau coup de cœur',[['name','Nom'],['amount','Prix','number']],d=>wishes.push([d.name,+d.amount,'Fringues']))}
if(p==='dettes-et-epargne'){root.innerHTML='<h1>Dettes & épargne</h1><p class="sub">Chaque petit pas compte ✨</p><div class="grid section"><div class="stat lav"><small>À rembourser</small><b>'+euro(debt)+'</b></div><div class="stat mint"><small>Épargné</small><b>'+euro(saved)+'</b></div></div><div class="section"><h2>Mes dettes</h2>'+card('🤝','Parents','40 € / mois',euro(debt),'<div class="track"><i style="width:'+Math.max(0,100-debt/120*100)+'%;background:var(--lav)"></i></div>')+'<button class="button full" id="repay">Rembourser</button><button class="ghost" id="new-debt">+ Nouvelle dette</button></div><div class="section"><h2>Épargne</h2>'+card('✳️','Coussin de sécurité','Objectif 300 €',euro(saved),'<div class="track"><i style="width:'+Math.min(100,saved/300*100)+'%;background:var(--mint)"></i></div>')+'<button class="button full" id="deposit">Verser</button><button class="ghost" id="new-goal">+ Nouvel objectif</button></div>';$('#repay').onclick=()=>form('Rembourser',[['amount','Montant','number']],d=>debt=Math.max(0,debt-(+d.amount)));$('#deposit').onclick=()=>form('Verser',[['amount','Montant','number']],d=>saved+=+d.amount);$('#new-debt').onclick=()=>form('Nouvelle dette',[['name','À qui ?'],['amount','Montant','number']],d=>toast(d.name+' ajoutée'));$('#new-goal').onclick=()=>form('Nouvel objectif',[['name','Nom'],['amount','Cible','number']],d=>toast(d.name+' créé'))}
if(p==='plus'){root.innerHTML='<p class="eyebrow">Mon espace</p><h1>Plus</h1><div class="card row section"><div class="icon">L</div><div class="grow"><b>Léa</b><small>demo@bbudget.app</small></div><span>›</span></div><div class="section"><h2>Gérer mon budget</h2><div class="card" id="menu1"></div></div><div class="section"><h2>Prendre du recul</h2><div class="card" id="menu2"></div></div><div class="section"><h2>Application</h2><div class="card" id="menu3"></div></div><button class="ghost" onclick="toast(\'Déconnexion : maquette uniquement\')">Se déconnecter</button>';const link=(icon,name,slug)=>'<button class="listbutton" onclick="'+(slug?'go(\''+slug+'\')':'toast(\''+name+' · aperçu à créer\')')+'"><span>'+icon+'</span><span>'+name+'</span><span>›</span></button>';$('#menu1').innerHTML=link('💶','Rentrées')+link('🛍️','Enveloppes','enveloppes')+link('▣','Abonnements','abonnements');$('#menu2').innerHTML=link('📊','Bilan du mois','bilan-du-mois')+link('💡','Astuces & défis');$('#menu3').innerHTML=link('⚙️','Réglages')}
if(p==='enveloppes'){root.innerHTML='<div class="head"><button class="back" onclick="go(\'plus\')">‹</button><div><p class="eyebrow">Budgets plaisir · octobre 2026</p><h1>Enveloppes</h1></div></div><div class="hero"><small>Disponible dans les enveloppes</small><strong>'+euro(envelopes.reduce((n,e)=>n+e[3]-e[2],0))+'</strong><p>'+envelopes.length+' enveloppes pour tes envies</p></div><div class="section">'+envelopes.map(e=>card(e[1],e[0],euro(e[2])+' / '+euro(e[3]),euro(e[3]-e[2]),'<div class="track"><i style="width:'+Math.min(100,e[2]/e[3]*100)+'%;background:'+e[4]+'"></i></div>')).join('')+'</div><button class="button full" id="new-envelope">+ Créer une enveloppe</button>';$('#new-envelope').onclick=()=>form('Nouvelle enveloppe',[['name','Nom'],['amount','Budget mensuel','number']],d=>envelopes.push([d.name,'✨',0,+d.amount,'#f2a4c1']))}
if(p==='abonnements'){const total=subs.reduce((n,s)=>n+s[1],0);root.innerHTML='<div class="head"><button class="back" onclick="go(\'plus\')">‹</button><div><p class="eyebrow">Frais fixes & prélèvements</p><h1>Abonnements</h1></div></div><div class="hero"><small>Coût mensuel</small><strong>'+euro(total)+'</strong><p>Soit '+euro(total*12)+' par an</p></div><div class="section"><h2>Prochains prélèvements</h2>'+subs.map((s,i)=>card('▣',s[0],'Le '+s[2]+' du mois',euro(s[1]),'<button class="ghost" onclick="subs.splice('+i+',1);render()">Retirer du suivi</button>')).join('')+'</div><button class="button full" id="new-sub">+ Ajouter un abonnement</button><div class="tip">Un abonnement retiré du suivi doit être résilié auprès du service concerné.</div>';$('#new-sub').onclick=()=>form('Nouvel abonnement',[['name','Nom'],['amount','Prix mensuel','number']],d=>subs.push([d.name,+d.amount,5]))}
if(p==='bilan-du-mois'){root.innerHTML='<div class="head"><button class="back" onclick="go(\'plus\')">‹</button><div><p class="eyebrow">Octobre 2026</p><h1>Bilan du mois ✨</h1></div></div><div class="grid section"><div class="stat mint"><small>Rentrées</small><b>550,00 €</b></div><div class="stat"><small>Dépenses</small><b>60,49 €</b></div></div><div class="section card"><h2>Répartition par enveloppe</h2><div class="donut"><b>60,49 €<small>Dépenses plaisir</small></b></div><div class="grid"><span>🩷 Fringues 29,99 €</span><span>💜 Cosméto 12,50 €</span><span>💚 Sorties 18,00 €</span></div></div><div class="card"><h2>Par rapport au mois dernier</h2><p class="muted">+30 € en fringues · +13 € en cosméto · +18 € en sorties</p><p class="muted">On observe sans juger 💗</p></div><div class="stat section"><small>Total économisé ce mois-ci</small><b>0,00 €</b></div>'}
}
document.addEventListener('DOMContentLoaded',()=>{$('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))closeModal()};render()});
</script><script>document.querySelector('[data-nav="plus"]').classList.add('active')</script></body></html>
